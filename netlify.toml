# Maleval Traduções — configuração Netlify
# Site estático multi-página (sem build). Headers de segurança + cache.

# ============================================================
# HEADERS — segurança e performance
# ============================================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # CSP com allowlist do widget Google Translate (detecção de idioma do site).
    # 'unsafe-inline' é necessário: o site usa CSS/JS inline por design (zero requests extras).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com https://www.google.com https://www.gstatic.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://www.gstatic.com https://translate.googleapis.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.gstatic.com https://translate.google.com https://translate.googleapis.com https://www.google.com https://fonts.gstatic.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com; connect-src 'self' https://translate.googleapis.com https://translate-pa.googleapis.com https://translate.google.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://analytics.google.com https://www.googletagmanager.com; frame-src https://translate.googleapis.com https://translate.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# HTML sempre revalidado (conteúdo pode mudar a cada deploy)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Imagens e ícones — cache de 1 semana (mudam raramente)
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Lead magnet PDF — 1 dia
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# ============================================================
# REDIRECTS — ativos apenas quando o domínio próprio apontar
# para o Netlify (não afetam o subdomínio *.netlify.app)
# ============================================================

[[redirects]]
  from = "https://www.malevaltraducoes.com.br/*"
  to = "https://malevaltraducoes.com.br/:splat"
  status = 301
  force = true

# Subdomínio Netlify antigo → domínio próprio (evita conteúdo duplicado no Google)
[[redirects]]
  from = "https://maleval-traducoes.netlify.app/*"
  to = "https://malevaltraducoes.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://malevaltraducoes.com.br/*"
  to = "https://malevaltraducoes.com.br/:splat"
  status = 301
  force = true

# 404: Netlify serve /404.html automaticamente para rotas inexistentes.
# NÃO adicionar fallback "/* -> /index.html" — site multi-página, isso
# criaria soft-404 (toda URL errada devolveria a home com status 200).


# ------------------------------------------------------------
# CANONICALIZACAO — resolvida por canonical unico, SEM redirect
#
# Medido em 31/08/2026: 5 paginas comerciais viviam em duas URLs
# 200 simultaneas (/interpretacao-simultanea e a mesma com .html),
# sem 301 entre elas, diluindo sinal de SEO.
#
# Criterio do Chairman: URL canonica unica > redirect 301 > duas
# URLs concorrentes. Os tres testes passaram:
#   1. a versao .html e a unica referenciada internamente (18 links
#      com .html, ZERO sem)
#   2. canonical e sitemap apontam ambos para .html nas 5 paginas
#   3. nenhum link interno gera mais a URL duplicada
#
# Logo, nao ha 301 a criar: menos codigo, menos processamento,
# nenhuma cadeia de redirects, menor custo de manutencao.
# Residual conhecido: as URLs sem .html continuam devolvendo 200 e
# podem estar indexadas; a consolidacao fica a cargo da tag
# canonical, que agora e consistente nas 5.
# ------------------------------------------------------------

# ------------------------------------------------------------
# CANONICALIZACAO — 5 URLs historicas sem .html
#
# Medido 31/08/2026: essas 5 paginas comerciais viviam em DUAS
# URLs 200 simultaneas, sem 301 entre elas, diluindo sinal de SEO.
# Convencao da casa e .html (34 das 41 entradas do sitemap; 807
# links internos). Canonical e sitemap das 5 foram alinhados a .html.
#
# Arquitetura resultante:
#   URL historica sem .html  -> 301 -> URL canonica .html
#   link interno             -> URL .html diretamente (zero saltos)
#
# Canonical orienta buscador, mas nao impede o acesso a URL antiga;
# o 301 resolve a entrada externa e transfere o sinal.
#
# Caminhos NOMEADOS, nunca curinga: "/* -> /:splat.html" mascararia
# 404 legitimo, como adverte a nota do 404 acima. Sem cadeia: cada
# origem aponta direto ao destino final.
# ------------------------------------------------------------

[[redirects]]
  from = "/diplomatico-defesa"
  to = "/diplomatico-defesa.html"
  status = 301

[[redirects]]
  from = "/interpretacao-simultanea"
  to = "/interpretacao-simultanea.html"
  status = 301

[[redirects]]
  from = "/interpretacao-consecutiva"
  to = "/interpretacao-consecutiva.html"
  status = 301

[[redirects]]
  from = "/traducao-tecnica"
  to = "/traducao-tecnica.html"
  status = 301

[[redirects]]
  from = "/localizacao-corporativa"
  to = "/localizacao-corporativa.html"
  status = 301
